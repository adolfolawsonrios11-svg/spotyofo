<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090a0d">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="SpotyOFO">
  <title>SpotyOFO</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@360;480;580;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <a class="brand" href="#/">
        <span class="mark" aria-hidden="true"></span>
        <span>SpotyOFO</span>
      </a>
      <nav class="nav" aria-label="Principal">
        <a class="nav-link" href="#/" data-nav="home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1z"/></svg><span>Inicio</span></a>
        <a class="nav-link" href="#/search" data-nav="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="m16 16 4 4"/></svg><span>Buscar</span></a>
        <a class="nav-link" href="#/library" data-nav="library"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h10a3 3 0 0 1 3 3v13H8a3 3 0 0 0-3 3z"/><path d="M5 4v16"/></svg><span>Biblioteca</span></a>
        <a class="nav-link" href="#/uploads" data-nav="uploads"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V6"/><path d="m8 9 4-4 4 4"/><path d="M5 20h14"/></svg><span>Subir</span></a>
        <a class="nav-link" href="#/equipo" data-nav="equipo" aria-label="Archivo de Equipo"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg><span class="nav-full">Archivo de Equipo</span><span class="nav-short">Equipo</span></a>
      </nav>
      <div class="side-head">
        <span>Listas</span>
        <button type="button" id="new-playlist" aria-label="Crear lista">+</button>
      </div>
      <div class="side-scroll" id="side-playlists"></div>
    </aside>

    <div class="workspace">
      <header class="topbar">
        <div class="history">
          <button type="button" id="go-back" aria-label="Atrás">←</button>
          <button type="button" id="go-forward" aria-label="Adelante">→</button>
        </div>
        <form id="search-form" class="search" role="search">
          <label class="sr-only" for="search-input">Buscar</label>
          <input id="search-input" type="search" placeholder="Artistas, discos o canciones" autocomplete="off">
        </form>
        <p class="local-note">Sin cuentas · este equipo</p>
      </header>
      <div id="view" class="view" tabindex="-1"></div>
    </div>

    <aside class="drawer" id="drawer" hidden>
      <div class="drawer-head">
        <h2 id="drawer-title">Cola</h2>
        <button type="button" id="drawer-close" aria-label="Cerrar panel">×</button>
      </div>
      <div id="drawer-body"></div>
    </aside>
  </div>

  <footer class="player" id="player">
    <div class="player-track">
      <button type="button" class="cover-btn" id="np-open" aria-label="Abrir ahora suena">
        <img id="p-cover" alt="">
      </button>
      <div class="player-meta">
        <button type="button" class="link" id="p-title">Elige una pista</button>
        <button type="button" class="link faint" id="p-artist"></button>
      </div>
      <button type="button" class="icon-btn heart" id="p-like" aria-label="Me gusta" disabled><svg viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-9a4 4 0 0 1 7-2 4 4 0 0 1 7 2c0 4.6-7 9-7 9z"/></svg></button>
    </div>
    <div class="player-main">
      <div class="transport">
        <button type="button" class="icon-btn" id="p-shuffle" aria-label="Aleatorio"><svg viewBox="0 0 24 24"><path d="M16 4h5v5M4 18l5.5-5.5M14 14l6 6M4 6l6 6M16 20h5v-5"/></svg></button>
        <button type="button" class="icon-btn" id="p-prev" aria-label="Anterior"><svg viewBox="0 0 24 24"><path d="M6 5v14M18 5 8 12l10 7z"/></svg></button>
        <button type="button" class="play-main" id="p-play" aria-label="Reproducir"><svg viewBox="0 0 24 24"><path d="M8 5v14l12-7z"/></svg></button>
        <button type="button" class="icon-btn" id="p-next" aria-label="Siguiente"><svg viewBox="0 0 24 24"><path d="M18 5v14M6 5l10 7-10 7z"/></svg></button>
        <button type="button" class="icon-btn" id="p-repeat" aria-label="Repetir"><svg viewBox="0 0 24 24"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14M7 22l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg></button>
      </div>
      <div class="seek">
        <span id="p-elapsed">0:00</span>
        <input id="p-seek" type="range" min="0" max="1000" value="0" aria-label="Posición">
        <span id="p-duration">0:00</span>
      </div>
    </div>
    <div class="player-tools">
      <button type="button" class="text-btn" id="p-queue">Cola</button>
      <button type="button" class="text-btn" id="p-studio">Estudio</button>
      <button type="button" class="icon-btn" id="p-mute" aria-label="Silencio"><svg viewBox="0 0 24 24"><path d="M4 10v4h4l5 4V6L8 10H4zM16 9a5 5 0 0 1 0 6"/></svg></button>
      <input id="p-volume" type="range" min="0" max="100" value="85" aria-label="Volumen">
      <canvas id="p-viz" width="92" height="28" aria-hidden="true"></canvas>
    </div>
  </footer>

  <section class="now" id="now" hidden>
    <div class="now-bg" id="now-bg"></div>
    <div class="now-top">
      <button type="button" id="now-close">Cerrar</button>
    </div>
    <div class="now-body">
      <img id="now-cover" alt="">
      <div>
        <p class="kicker" id="now-kicker"></p>
        <h2 id="now-title"></h2>
        <p id="now-artist"></p>
        <p class="now-meta" id="now-meta"></p>
        <canvas id="now-viz" width="720" height="150" aria-label="Visualizador"></canvas>
      </div>
    </div>
  </section>

  <div class="menu" id="menu" hidden role="menu"></div>
  <div class="modal-back" id="modal" hidden>
    <form class="modal" id="modal-form">
      <h2 id="modal-title"></h2>
      <div id="modal-body"></div>
      <div class="modal-actions">
        <button type="button" class="btn ghost" id="modal-cancel">Cancelar</button>
        <button type="submit" class="btn solid" id="modal-ok">Guardar</button>
      </div>
    </form>
  </div>
  <div class="toast" id="toast" hidden></div>
  <script type="module" src="/static/js/main.js"></script>
</body>
</html>
